# /etc/nginx/sites-available/hbssuite.com
# React build served by Nginx, /api (+ sw.js, manifest) proxied to the Express API.
# Same origin = session cookie, Google/Meta OAuth callbacks and webhooks keep their URLs.

upstream hbs_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name hbssuite.com www.hbssuite.com;
    # certbot --nginx adds the 443 block + redirect

    root /root/hbs-suite/frontend/dist;
    index index.html;
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # hashed build assets - cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(icons|illustrations)/ {
        expires 7d;
        try_files $uri =404;
    }

    # live notification stream (Server-Sent Events): no buffering, long timeout
    location = /api/notifications/stream {
        proxy_pass http://hbs_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://hbs_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # manual "Run AI job" can take minutes
        proxy_send_timeout 900s;
    }

    location = /sw.js {
        proxy_pass http://hbs_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        proxy_pass http://hbs_api;
        proxy_set_header Host $host;
    }

    # SPA: every other path is a client route
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}